<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 610" role="img" aria-labelledby="title description">
<title id="title">UnicornTunes playback architecture</title>
<desc id="description">Guest browsers connect to the Docker web app. The app controls Spotify through its Web API and local MPD through restricted SSH. Soloist and MPD run on a separate playback device connected to the speakers.</desc>
